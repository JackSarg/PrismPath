<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="PrismPath prism locator icon">
  <defs>
    <linearGradient id="bg" x1="25" y1="20" x2="105" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12314a"/>
      <stop offset="1" stop-color="#071421"/>
    </linearGradient>
    <linearGradient id="diamond" x1="33" y1="28" x2="98" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63e3f2"/>
      <stop offset="1" stop-color="#18b7d2"/>
    </linearGradient>
    <linearGradient id="node" x1="58" y1="56" x2="71" y2="73" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79edbe"/>
      <stop offset="1" stop-color="#43d59f"/>
    </linearGradient>
  </defs>

  <!-- Chrome's 128px store icon guidance calls for a 96px mark with 16px transparent padding. -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#bg)" stroke="#244b65" stroke-width="3"/>

  <!-- Subtle prism facets preserve the selected premium concept without obscuring the locator. -->
  <path d="M64 25 27 64h24l13-18Z" fill="#1b6c9e" fill-opacity=".56"/>
  <path d="M64 25 101 64H77L64 46Z" fill="#31cce3" fill-opacity=".28"/>
  <path d="m27 64 37 39V82L51 64Z" fill="#124a73" fill-opacity=".72"/>
  <path d="m101 64-37 39V82l13-18Z" fill="#1c88b1" fill-opacity=".44"/>
  <path d="M64 25 101 64 64 103 27 64Z" fill="none" stroke="url(#diamond)" stroke-width="6" stroke-linejoin="round"/>

  <!-- A high-contrast target remains readable when the artwork is reduced to toolbar size. -->
  <circle cx="64" cy="64" r="20" fill="#081725" fill-opacity=".9" stroke="#f3fbff" stroke-width="5"/>
  <path d="M64 38v9m0 34v9M38 64h9m34 0h9" fill="none" stroke="#f3fbff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="8" fill="url(#node)" stroke="#eaffff" stroke-width="2"/>
</svg>
